name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly-published advisory against an unchanged dependency
    # still surfaces — most vulnerabilities appear long after the code lands.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      # Audits the pinned requirements without installing them, so a
      # vulnerable transitive pin is still caught.
      - name: Audit requirements
        run: pip-audit --requirement requirements.txt --strict --desc

  node-dependencies:
    name: Node dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      # Blocking gate: production dependencies only. These are the packages
      # that actually reach a user's browser.
      #
      # Dev-only advisories are reported below but do not block. As of
      # 2026-07-30 every high advisory in this project is confined to build
      # tooling (eslint's glob/minimatch chain, and a vite dev-server path
      # traversal), none of which ships in the bundle — and clearing them
      # needs eslint 10 + vite 8, both breaking majors. Blocking on those
      # would train everyone to ignore a red gate, which is worse than the
      # advisories themselves. Revisit when those majors are scheduled.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Full advisory report (informational)
        if: always()
        run: |
          echo "### npm audit (all dependencies)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit 2>&1 | tail -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A committed .env or private key is the single most common way a
      # production credential leaks out of a repository.
      - name: Check for committed secrets
        run: |
          set -euo pipefail
          fail=0

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it and rotate every secret it held."
            fail=1
          fi

          keys=$(git ls-files -- '*.pem' '*.key' '*.p12' '*.pfx' 'id_rsa*' || true)
          if [ -n "$keys" ]; then
            echo "::error::Private key material is tracked by git:"
            echo "$keys"
            fail=1
          fi

          # High-confidence provider token formats only, to avoid noise.
          if git grep -nIE \
               '(sk_live_[0-9a-zA-Z]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[0-9a-zA-Z]{36})' \
               -- . ':(exclude).github/workflows/security.yml' >/dev/null 2>&1; then
            echo "::error::A credential-shaped string is committed:"
            git grep -nIE \
              '(sk_live_[0-9a-zA-Z]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[0-9a-zA-Z]{36})' \
              -- . ':(exclude).github/workflows/security.yml'
            fail=1
          fi

          [ "$fail" -eq 0 ] && echo "No committed secrets found."
          exit "$fail"
