name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend import + migration check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Test suites are kept out of the repository, so CI verifies what it
      # still can: that the app imports cleanly and the migration chain is
      # linear with a single head.
      - name: Import application
        run: python -c "import app.main; print('app imports OK')"
      - name: Check migration chain
        run: alembic heads 2>&1 | tee /tmp/heads.txt && test "$(grep -c '(head)' /tmp/heads.txt)" -eq 1

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
