services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: quote-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quote_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quote_password}
      POSTGRES_DB: ${POSTGRES_DB:-quote_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only — never publish the database to the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quote_user} -d ${POSTGRES_DB:-quote_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quote-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: quote-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      # Loopback only — never publish Redis to the network.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quote-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quote-backend
    # Pass the whole .env through rather than enumerating variables. Listing
    # them one by one meant every new setting silently kept its default inside
    # the container — that is how the SMTP credentials went missing, and it
    # would have done the same to FIELD_ENCRYPTION_KEY (you would set a key,
    # believe columns were encrypted, and get plaintext).
    # The explicit `environment:` entries below still win over anything in
    # .env, so container-specific values like DATABASE_URL stay correct.
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-quote_user}:${POSTGRES_PASSWORD:-quote_password}@postgres:5432/${POSTGRES_DB:-quote_db}
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=production
      - DEBUG=false
      - AUTO_CREATE_TABLES=false
      # No insecure fallback: compose fails loudly if the secret is missing.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost"]}
      - FORCE_HTTPS=${FORCE_HTTPS:-false}
      # Outbound mail. Without these the password reset email is only written
      # to the log — the flow appears to work and no user ever receives a link.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@localhost}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-ForgeQuote}
      # Reserved addresses and legal identity rendered into the policy pages.
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - LEGAL_COMPANY_NAME=${LEGAL_COMPANY_NAME:-ForgeQuote}
      - LEGAL_CONTACT_EMAIL=${LEGAL_CONTACT_EMAIL:-support@localhost}
      - LEGAL_PRIVACY_EMAIL=${LEGAL_PRIVACY_EMAIL:-privacy@localhost}
      - LEGAL_SECURITY_EMAIL=${LEGAL_SECURITY_EMAIL:-security@localhost}
      - LEGAL_COMPANY_ADDRESS=${LEGAL_COMPANY_ADDRESS:-}
      - LEGAL_JURISDICTION=${LEGAL_JURISDICTION:-India}
      # Billing
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - uploads_data:/app/uploads
    ports:
      # Loopback only — external traffic must go through the nginx frontend.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - quote-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quote-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - quote-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  quote-network:
    driver: bridge
