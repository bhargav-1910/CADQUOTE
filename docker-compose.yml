services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: quote-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quote_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quote_password}
      POSTGRES_DB: ${POSTGRES_DB:-quote_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quote_user} -d ${POSTGRES_DB:-quote_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quote-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: quote-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quote-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quote-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-quote_user}:${POSTGRES_PASSWORD:-quote_password}@postgres:5432/${POSTGRES_DB:-quote_db}
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-use-a-long-random-string}
      - ALLOWED_HOSTS=*
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - quote-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quote-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - quote-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  quote-network:
    driver: bridge
