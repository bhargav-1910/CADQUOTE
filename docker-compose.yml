services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: quote-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quote_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quote_password}
      POSTGRES_DB: ${POSTGRES_DB:-quote_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only — never publish the database to the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quote_user} -d ${POSTGRES_DB:-quote_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quote-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: quote-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      # Loopback only — never publish Redis to the network.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quote-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quote-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-quote_user}:${POSTGRES_PASSWORD:-quote_password}@postgres:5432/${POSTGRES_DB:-quote_db}
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=production
      - DEBUG=false
      - AUTO_CREATE_TABLES=false
      # No insecure fallback: compose fails loudly if the secret is missing.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - ALLOWED_HOSTS=*
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost}
    volumes:
      - uploads_data:/app/uploads
    ports:
      # Loopback only — external traffic must go through the nginx frontend.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - quote-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quote-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - quote-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  quote-network:
    driver: bridge
