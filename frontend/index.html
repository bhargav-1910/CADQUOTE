<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>ForgeQuote — Instant CNC Machining Quotes</title>
    <meta name="description" content="Upload a STEP or STL file and get an itemized CNC machining quote in under a minute: stock, cycle time, setups, tooling, inspection and margin, priced in INR." />
    <meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
    <!-- Link previews (WhatsApp, LinkedIn, X). og:url / og:image need absolute URLs, so the
         build adds them from VITE_SITE_URL (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ForgeQuote" />
    <meta property="og:title" content="ForgeQuote — Instant CNC Machining Quotes" />
    <meta property="og:description" content="Itemized CNC quotes from your CAD files in under a minute." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Set the theme class before first paint (mirrors src/theme.ts) so dark-mode users never see a
         white flash. A same-origin file, not inline: the CSP is script-src 'self'. Must stay render-blocking. -->
    <script src="/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- display=swap keeps text visible while fonts stream in; preconnect above hides the handshake. -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
